name: Paper Minecraft Server

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: paper-server
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest stable Paper
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'
          PROJECT='paper'

          VERSION=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/${PROJECT}" |
            jq -r '.versions | to_entries[] | .value[]' | sort -V | tail -n1)

          echo "Paper version: ${VERSION}"

          BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION}/builds")

          URL=$(echo "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')

          if [ -z "$URL" ]; then
            echo 'No stable Paper build was found.'
            exit 1
          fi

          echo "Downloading: $URL"
          curl -fL -A "$USER_AGENT" -o paper.jar "$URL"
          ls -lh paper.jar

      - name: Prepare server
        shell: bash
        run: |
          set -euo pipefail
          test -f eula.txt
          grep -q '^eula=true$' eula.txt
          mkdir -p plugins

      - name: Start Paper
        shell: bash
        run: |
          set -uo pipefail
          echo '============================================================'
          echo '🟢 Starting Paper Minecraft server'
          echo "🕒 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo '☕ Java:'
          java -version
          echo '============================================================'
          java -Xms512M -Xmx4G -jar paper.jar --nogui

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-logs-${{ github.run_number }}
          path: |
            logs/
            crash-reports/
            *.log
          if-no-files-found: ignore
          retention-days: 7
