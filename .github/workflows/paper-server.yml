name: Paper Minecraft Server + Playit + Geyser

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: paper-server
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download latest stable Paper
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'
          PROJECT='paper'
          VERSIONS=$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/${PROJECT}" | jq -r '.versions | to_entries[] | .value[]' | sort -V -r)
          URL=''
          FOUND_VERSION=''
          for VERSION in $VERSIONS; do
            BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION}/builds")
            URL=$(echo "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // ""')
            if [ -n "$URL" ]; then FOUND_VERSION="$VERSION"; break; fi
          done
          if [ -z "$URL" ]; then echo 'No stable Paper builds are currently available.'; exit 1; fi
          echo "Found stable Paper version: ${FOUND_VERSION}"
          echo "Downloading: ${URL}"
          curl -fL -A "$USER_AGENT" -o paper.jar "$URL"
          ls -lh paper.jar

      - name: Download Geyser, Floodgate and Playit plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'

          echo '🌉 Downloading Geyser-Spigot...'
          curl -fL -A "$USER_AGENT" 'https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot' -o plugins/Geyser-Spigot.jar

          echo '🚪 Downloading Floodgate-Spigot...'
          curl -fL -A "$USER_AGENT" 'https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot' -o plugins/floodgate-spigot.jar

          echo '🌐 Downloading Playit Minecraft plugin...'
          curl -fL -A "$USER_AGENT" 'https://github.com/playit-cloud/playit-minecraft-plugin/releases/latest/download/playit-minecraft-plugin.jar' -o plugins/playit-minecraft-plugin.jar

          echo '📦 Installed plugins:'
          ls -lh plugins/*.jar

      - name: Prepare server
        shell: bash
        run: |
          set -euo pipefail
          test -f eula.txt
          grep -q '^eula=true$' eula.txt
          mkdir -p plugins

      - name: Start Paper
        shell: bash
        run: |
          set -uo pipefail
          echo '============================================================'
          echo '🟢 Starting Paper Minecraft server'
          echo '🌉 Geyser + Floodgate + Playit plugin installed'
          echo "🕒 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo '☕ Java:'
          java -version
          echo '============================================================'
          java -Xms512M -Xmx4G -jar paper.jar --nogui

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-logs-${{ github.run_number }}
          path: |
            logs/
            crash-reports/
            *.log
          if-no-files-found: ignore
          retention-days: 7
