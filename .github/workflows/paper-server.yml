name: Paper Minecraft Server + Playit + Geyser

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: paper-server
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download latest stable Paper
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'
          PROJECT='paper'

          VERSIONS=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/${PROJECT}" |
            jq -r '.versions | to_entries[] | .value[]' | sort -V -r)

          URL=''
          FOUND_VERSION=''

          for VERSION in $VERSIONS; do
            BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
              "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION}/builds")

            URL=$(echo "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // ""')

            if [ -n "$URL" ]; then
              FOUND_VERSION="$VERSION"
              break
            fi
          done

          if [ -z "$URL" ]; then
            echo 'No stable Paper builds are currently available.'
            exit 1
          fi

          echo "Found stable Paper version: ${FOUND_VERSION}"
          echo "Downloading: ${URL}"
          curl -fL -A "$USER_AGENT" -o paper.jar "$URL"
          ls -lh paper.jar

      - name: Download Geyser + Floodgate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'

          echo '🌉 Downloading Geyser-Spigot...'
          curl -fL -A "$USER_AGENT" \
            'https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot' \
            -o plugins/Geyser-Spigot.jar

          echo '🚪 Downloading Floodgate-Spigot...'
          curl -fL -A "$USER_AGENT" \
            'https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot' \
            -o plugins/floodgate-spigot.jar

          ls -lh plugins/*.jar

      - name: Prepare server
        shell: bash
        run: |
          set -euo pipefail
          test -f eula.txt
          grep -q '^eula=true$' eula.txt
          mkdir -p plugins

      - name: Start Playit agent
        if: ${{ secrets.PLAYIT_SECRET_KEY != '' }}
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo '🌐 Starting Playit agent...'
          docker pull ghcr.io/playit-cloud/playit-agent:latest
          docker run -d --name playit-agent --network host \
            -e SECRET_KEY="$SECRET_KEY" \
            ghcr.io/playit-cloud/playit-agent:latest
          sleep 8
          echo '📡 Playit agent logs:'
          docker logs --tail 80 playit-agent || true

      - name: Verify Playit agent
        if: ${{ secrets.PLAYIT_SECRET_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! docker ps --format '{{.Names}}' | grep -qx 'playit-agent'; then
            echo '❌ Playit agent is not running.'
            docker logs playit-agent || true
            exit 1
          fi
          echo '✅ Playit agent is running.'
          echo 'ℹ️ Java tunnel: TCP localhost:25565'
          echo 'ℹ️ Bedrock tunnel: UDP localhost:19132'

      - name: Start Paper
        shell: bash
        run: |
          set -uo pipefail
          echo '============================================================'
          echo '🟢 Starting Paper Minecraft server'
          echo '🌉 Geyser + Floodgate plugins installed'
          echo "🕒 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo '☕ Java:'
          java -version
          echo '============================================================'
          java -Xms512M -Xmx4G -jar paper.jar --nogui

      - name: Playit logs
        if: always()
        shell: bash
        run: |
          echo '🌐 Playit final logs:'
          docker logs --tail 150 playit-agent 2>/dev/null || true
          docker rm -f playit-agent 2>/dev/null || true

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-logs-${{ github.run_number }}
          path: |
            logs/
            crash-reports/
            *.log
          if-no-files-found: ignore
          retention-days: 7
