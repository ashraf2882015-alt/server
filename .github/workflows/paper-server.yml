name: Paper Minecraft Server + Playit Agent + Geyser

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: paper-server
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download latest stable Paper
        shell: bash
        run: |
          set -euo pipefail
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'
          PROJECT='paper'
          VERSIONS=$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/${PROJECT}" | jq -r '.versions | to_entries[] | .value[]' | sort -V -r)
          URL=''
          FOUND_VERSION=''
          for VERSION in $VERSIONS; do
            BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${VERSION}/builds")
            URL=$(echo "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // ""')
            if [ -n "$URL" ]; then FOUND_VERSION="$VERSION"; break; fi
          done
          if [ -z "$URL" ]; then echo 'No stable Paper builds are currently available.'; exit 1; fi
          echo "Found stable Paper version: ${FOUND_VERSION}"
          curl -fL -A "$USER_AGENT" -o paper.jar "$URL"
          ls -lh paper.jar

      - name: Download Geyser and Floodgate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          USER_AGENT='ashraf2882015-alt-paper-server/1.0 (https://github.com/ashraf2882015-alt/server)'
          echo '🌉 Downloading Geyser-Spigot...'
          curl -fL -A "$USER_AGENT" 'https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot' -o plugins/Geyser-Spigot.jar
          echo '🚪 Downloading Floodgate-Spigot...'
          curl -fL -A "$USER_AGENT" 'https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot' -o plugins/floodgate-spigot.jar
          ls -lh plugins/*.jar

      - name: Install Playit Agent
        shell: bash
        run: |
          set -euo pipefail
          echo '🌐 Downloading Playit Agent...'
          API='https://api.github.com/repos/playit-cloud/playit-agent/releases/latest'
          ASSET_URL=$(curl -fsSL "$API" | jq -r '.assets[] | select(.name | test("linux.*(amd64|x86_64)"; "i")) | .browser_download_url' | head -n1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo 'Could not find a Linux amd64 Playit release asset.'
            echo 'Available assets:'
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -fL "$ASSET_URL" -o playit
          chmod +x playit
          ./playit --version || true

      - name: Prepare server
        shell: bash
        run: |
          set -euo pipefail
          test -f eula.txt
          grep -q '^eula=true$' eula.txt
          mkdir -p plugins

      - name: Start Paper and Playit
        shell: bash
        run: |
          set -uo pipefail
          echo '============================================================'
          echo '🟢 Starting Paper + Geyser + Floodgate + Playit Agent'
          echo "🕒 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo '☕ Java:'
          java -version
          echo '============================================================'

          echo '🌐 Starting Playit Agent...'
          ./playit > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "Playit PID: $PLAYIT_PID"

          sleep 5
          echo '================ PLAYIT LOG ================'
          cat playit.log || true
          echo '============================================='

          echo '🧱 Starting Paper...'
          java -Xms512M -Xmx4G -jar paper.jar --nogui

      - name: Show Playit log
        if: always()
        shell: bash
        run: |
          echo '================ PLAYIT FINAL LOG ================'
          cat playit.log 2>/dev/null || true
          echo '==================================================='

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-logs-${{ github.run_number }}
          path: |
            logs/
            crash-reports/
            *.log
            playit.log
          if-no-files-found: ignore
          retention-days: 7
